<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موقع الصورة</title>
</head>
<body>
<h2>اختار صورة</h2>
<input type="file" id="pic" accept="image/*">
<pre id="info"></pre>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
document.getElementById("pic").onchange = async function (e) {
  const file = e.target.files[0];
  const info = document.getElementById("info");
  try {
    const data = await exifr.parse(file, true);
    let text = "نوع الملف: " + file.type + "\n";
    if (data && data.latitude) {
      text += "الموقع: " + data.latitude + ", " + data.longitude + "\n";
      text += "https://www.google.com/maps?q=" + data.latitude + "," + data.longitude;
    } else if (data) {
      text += "فيه بيانات EXIF لكن مفيش موقع.\nالكاميرا: " + (data.Make || "") + " " + (data.Model || "");
    } else {
      text += "مفيش أي بيانات EXIF في الملف ده.";
    }
    info.innerText = text;
  } catch (err) {
    info.innerText = "خطأ: " + err.message;
  }
};
</script>
</body>
</html>
