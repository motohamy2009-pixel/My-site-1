<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موقع الصورة</title>
</head>
<body>
<h2>اختار صورة</h2>
<input type="file" id="pic">
<pre id="info" style="font-size:20px"></pre>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
document.getElementById("pic").onchange = async function (e) {
  const file = e.target.files[0];
  const info = document.getElementById("info");
  try {
    const data = await exifr.parse(file, {gps: true, translateValues: true});
    const gps = await exifr.gps(file);
    let text = "";
    if (gps && Number.isFinite(gps.latitude) && Number.isFinite(gps.longitude)) {
      text += "خط العرض (Latitude): " + gps.latitude + "\n";
      text += "خط الطول (Longitude): " + gps.longitude + "\n";
    } else {
      text += "مفيش خط عرض وطول سليمين.\n";
      text += "القيم الخام:\n" + JSON.stringify(data && {
        lat: data.latitude, lon: data.longitude,
        GPSLatitude: data.GPSLatitude, GPSLongitude: data.GPSLongitude
      });
    }
    info.innerText = text;
  } catch (err) {
    info.innerText = "خطأ: " + err.message;
  }
};
</script>
</body>
</html>
